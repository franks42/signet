name: ci

# Every job only calls bb tasks: bb.edn is the single definition of each
# check, locally and here.
#
#   jca           Ubuntu, JDK 21 + 25: lint, fmt, JCA suite, bb smoke
#                 (no native libsodium needed)
#   sodium-macos  macOS, JDK 25: libsodium from Homebrew; libsodium backend on
#                 the JVM (+ JCA parity) and on bb; the consumer-from-jar check
#   sodium-linux  Ubuntu, JDK 25: libsodium 1.0.22 built from a checksum-pinned
#                 source tarball (Ubuntu's package is 1.0.18, no HKDF) and the
#                 dynamically linked bb (the static build cannot load native
#                 libraries); same libsodium-backend checks
#
# The libsodium backend needs nacljc, which is not on Clojars: it is
# checked out at a pinned commit and installed as the local snapshot
# (bb nacljc:install). Bump NACLJC_REF deliberately.

on:
  push:
    branches: [main]
  pull_request:

env:
  NACLJC_REF: 4a5031dea1de39b65ac6d194722b858b03ca7e34
  LIBSODIUM_VERSION: 1.0.22
  # SHA-256 of libsodium-1.0.22.tar.gz, identical from download.libsodium.org
  # and the GitHub release (checked 2026-09-23).
  LIBSODIUM_SHA256: adbdd8f16149e81ac6078a03aca6fc03b592b89ef7b5ed83841c086191be3349
  # babashka.ffi on Linux needs the DYNAMICALLY linked bb: the static (musl)
  # build, which setup-clojure installs on Linux, cannot load shared libraries
  # at all ("cannot load library", even by absolute path; seen 2026-09-23).
  BB_VERSION: 1.13.224
  # SHA-256 of babashka-1.13.224-linux-amd64.tar.gz (matches the release's .sha256)
  BB_LINUX_SHA256: 9640da489dbbeeb4830cd87f22e44e26af0f8313160c491c61d9c245e86206f6

jobs:
  jca:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: DeLaGuardo/setup-clojure@13.6.0
        with:
          bb: 'latest'
          cli: 'latest'
          clj-kondo: 'latest'
          cljfmt: 'latest'

      - uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-jca-${{ runner.os }}-${{ matrix.java }}-${{ hashFiles('deps.edn', 'bb.edn') }}
          restore-keys: deps-jca-${{ runner.os }}-${{ matrix.java }}-

      - name: Lint, fmt, JCA suite, bb smoke
        run: bb test:no-sodium

  sodium-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: franks42/nacljc
          ref: ${{ env.NACLJC_REF }}
          path: nacljc

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: DeLaGuardo/setup-clojure@13.6.0
        with:
          bb: 'latest'
          cli: 'latest'

      - name: Install libsodium (Homebrew)
        run: |
          brew install libsodium
          brew list --versions libsodium

      - uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-sodium-${{ runner.os }}-${{ hashFiles('deps.edn', 'bb.edn') }}-${{ env.NACLJC_REF }}
          restore-keys: deps-sodium-${{ runner.os }}-

      - name: Install the nacljc snapshot
        run: bb nacljc:install nacljc

      - name: libsodium backend on the JVM, with JCA parity
        run: bb test:jvm-sodium

      - name: libsodium backend on babashka
        run: bb test:bb-sodium

      - name: Consumer check against the installed signet jar
        run: bb test:jar

  sodium-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: franks42/nacljc
          ref: ${{ env.NACLJC_REF }}
          path: nacljc

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: DeLaGuardo/setup-clojure@13.6.0
        with:
          cli: 'latest'

      - name: Install the dynamically linked bb ${{ env.BB_VERSION }} (checksum-pinned)
        run: |
          curl -fsSL -o bb.tar.gz \
            "https://github.com/babashka/babashka/releases/download/v${BB_VERSION}/babashka-${BB_VERSION}-linux-amd64.tar.gz"
          echo "${BB_LINUX_SHA256}  bb.tar.gz" | sha256sum --check --strict
          sudo tar xzf bb.tar.gz -C /usr/local/bin bb
          file "$(command -v bb)"
          file "$(command -v bb)" | grep -q "dynamically linked" \
            || { echo "::error::bb must be dynamically linked for babashka.ffi"; exit 1; }
          bb --version

      - name: Build libsodium ${{ env.LIBSODIUM_VERSION }} from source (checksum-pinned)
        run: |
          curl -fsSL -o libsodium.tar.gz \
            "https://download.libsodium.org/libsodium/releases/libsodium-${LIBSODIUM_VERSION}.tar.gz"
          echo "${LIBSODIUM_SHA256}  libsodium.tar.gz" | sha256sum --check --strict
          tar xzf libsodium.tar.gz
          cd "libsodium-${LIBSODIUM_VERSION}"
          ./configure --prefix=/usr/local --disable-dependency-tracking
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig
          ldconfig -p | grep libsodium

      - uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-sodium-${{ runner.os }}-${{ hashFiles('deps.edn', 'bb.edn') }}-${{ env.NACLJC_REF }}
          restore-keys: deps-sodium-${{ runner.os }}-

      - name: Install the nacljc snapshot
        run: bb nacljc:install nacljc

      - name: libsodium backend on the JVM, with JCA parity
        run: bb test:jvm-sodium

      - name: libsodium backend on babashka
        run: bb test:bb-sodium
