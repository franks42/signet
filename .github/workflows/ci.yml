name: ci

# Every job only calls bb tasks: bb.edn is the single definition of each
# check, locally and here.
#
#   jca           Ubuntu, JDK 21 + 25: lint, fmt, JCA suite, bb smoke
#                 (no native libsodium needed)
#   sodium-macos  macOS, JDK 25: libsodium from Homebrew; libsodium backend on
#                 the JVM (+ JCA parity) and on bb; the consumer-from-jar check
#   sodium-linux  Ubuntu, JDK 25: libsodium 1.0.22 built from a checksum-pinned
#                 source tarball, because Ubuntu's own package is 1.0.18, which
#                 has no HKDF; same libsodium-backend checks
#
# The libsodium backend needs sodium.cljc, which is not on Clojars: it is
# checked out at a pinned commit and installed as the local snapshot
# (bb sodium:install). Bump SODIUM_CLJC_REF deliberately.

on:
  push:
    branches: [main]
  pull_request:

env:
  SODIUM_CLJC_REF: 7ebeeb99c90130adc1681a358476911c8d31259d
  LIBSODIUM_VERSION: 1.0.22
  # SHA-256 of libsodium-1.0.22.tar.gz, identical from download.libsodium.org
  # and the GitHub release (checked 2026-09-23).
  LIBSODIUM_SHA256: adbdd8f16149e81ac6078a03aca6fc03b592b89ef7b5ed83841c086191be3349

jobs:
  jca:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: DeLaGuardo/setup-clojure@13.6.0
        with:
          bb: 'latest'
          cli: 'latest'
          clj-kondo: 'latest'
          cljfmt: 'latest'

      - uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-jca-${{ runner.os }}-${{ matrix.java }}-${{ hashFiles('deps.edn', 'bb.edn') }}
          restore-keys: deps-jca-${{ runner.os }}-${{ matrix.java }}-

      - name: Lint, fmt, JCA suite, bb smoke
        run: bb test:no-sodium

  sodium-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: franks42/sodium.cljc
          ref: ${{ env.SODIUM_CLJC_REF }}
          path: sodium.cljc

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: DeLaGuardo/setup-clojure@13.6.0
        with:
          bb: 'latest'
          cli: 'latest'

      - name: Install libsodium (Homebrew)
        run: |
          brew install libsodium
          brew list --versions libsodium

      - uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-sodium-${{ runner.os }}-${{ hashFiles('deps.edn', 'bb.edn') }}-${{ env.SODIUM_CLJC_REF }}
          restore-keys: deps-sodium-${{ runner.os }}-

      - name: Install the sodium.cljc snapshot
        run: bb sodium:install sodium.cljc

      - name: libsodium backend on the JVM, with JCA parity
        run: bb test:jvm-sodium

      - name: libsodium backend on babashka
        run: bb test:bb-sodium

      - name: Consumer check against the installed signet jar
        run: bb test:jar

  sodium-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: franks42/sodium.cljc
          ref: ${{ env.SODIUM_CLJC_REF }}
          path: sodium.cljc

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: DeLaGuardo/setup-clojure@13.6.0
        with:
          bb: 'latest'
          cli: 'latest'

      - name: Build libsodium ${{ env.LIBSODIUM_VERSION }} from source (checksum-pinned)
        run: |
          curl -fsSL -o libsodium.tar.gz \
            "https://download.libsodium.org/libsodium/releases/libsodium-${LIBSODIUM_VERSION}.tar.gz"
          echo "${LIBSODIUM_SHA256}  libsodium.tar.gz" | sha256sum --check --strict
          tar xzf libsodium.tar.gz
          cd "libsodium-${LIBSODIUM_VERSION}"
          ./configure --prefix=/usr/local --disable-dependency-tracking
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig
          ldconfig -p | grep libsodium

      - uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-sodium-${{ runner.os }}-${{ hashFiles('deps.edn', 'bb.edn') }}-${{ env.SODIUM_CLJC_REF }}
          restore-keys: deps-sodium-${{ runner.os }}-

      - name: Install the sodium.cljc snapshot
        run: bb sodium:install sodium.cljc

      - name: libsodium backend on the JVM, with JCA parity
        run: bb test:jvm-sodium

      - name: Diagnose bb and libsodium loading (temporary)
        run: |
          file "$(command -v bb)" || true
          bb --version
          ls -l /usr/local/lib/libsodium* /lib/x86_64-linux-gnu/libsodium* 2>&1 || true
          bb -e '(require (quote babashka.ffi)) (println :abs-load (try (:path (babashka.ffi/load-library "/usr/local/lib/libsodium.so.26")) (catch Exception e (str "FAILED " (ex-message e)))))' || true
          bb -e '(require (quote babashka.ffi)) (println :bare-load (try (:path (babashka.ffi/load-library "libsodium.so.26")) (catch Exception e (str "FAILED " (ex-message e)))))' || true

      - name: libsodium backend on babashka
        run: bb test:bb-sodium
